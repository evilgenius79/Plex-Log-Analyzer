name: Release builds

# Builds a standalone executable for Windows, Linux and macOS with PyInstaller,
# checks each one against the sample logs, and attaches them to a GitHub release.
# Runs when a tag like v1.2 is pushed, or from the Actions tab ("Run workflow")
# with a tag name, in which case the tag is created on the chosen commit. The
# script itself stays stdlib-only; PyInstaller is a build-time tool here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update, e.g. v1.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: plexreport-windows-x64.exe
            built: dist/plexreport.exe
          - os: ubuntu-latest
            asset: plexreport-linux-x64
            built: dist/plexreport
          - os: macos-latest
            asset: plexreport-macos-arm64
            built: dist/plexreport
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Build
        run: pyinstaller --onefile --clean --name plexreport plexreport.py
      - name: Check the build against the sample logs
        shell: bash
        run: python examples/check_sample.py "${{ matrix.built }}"
      - name: Name the asset
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # --target only applies when the tag does not exist yet (manual runs)
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "plexreport $TAG" --generate-notes
          gh release upload "$TAG" assets/* --clobber
